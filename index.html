<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recall · 原文刷题</title><link rel="stylesheet" href="style.css"><script defer src="data.js"></script><script defer src="app.js"></script></head><body><header><a class="brand" href="./">Recall<span>原文刷题</span></a><span id="stats"></span><button id="export">导出进度</button><label class="import">导入进度<input id="import" type="file" accept="application/json"></label></header><main><aside><div class="eyebrow">YOUR DAILY PRACTICE</div><h1>把读过的，<br>真正记住。</h1><p class="muted">读原文 · 选答案 · 连续复习</p><label>题库<select id="category"><option value="all">全部题库</option><option value="listening-t2">听力 Task 2</option><option value="listening-t3">听力 Task 3</option><option value="listening-t4">听力 Task 4</option><option value="reading-t3">阅读 · 39篇选择题</option></select></label><label>练习范围<select id="mode"><option value="all">全部文章</option><option value="new">尚未完成</option><option value="wrong">错题文章</option><option value="star">已收藏</option></select></label><label>搜索文章<input id="search" placeholder="中文 / 英文关键词"></label><div class="row"><button id="shuffle">随机排序</button><button id="ordered">高频优先</button></div><p id="count" class="muted"></p><nav id="list" aria-label="文章目录"></nav><p class="footnote">进度保存在当前浏览器。换设备时可导出、导入；清除浏览器数据会删除本机进度。</p></aside><section id="workspace"><div id="article"></div></section></main><div id="toast" role="status" aria-live="polite"></div></body></html>
